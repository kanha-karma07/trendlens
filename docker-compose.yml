services:
  postgres:
    image: postgres:16-alpine
    container_name: trendlens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trendlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trendlens}
      POSTGRES_DB: ${POSTGRES_DB:-trendlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trendlens} -d ${POSTGRES_DB:-trendlens}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trendlens_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trendlens_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATA_MODE=${DATA_MODE:-demo}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-trendlens}:${POSTGRES_PASSWORD:-trendlens}@postgres:5432/${POSTGRES_DB:-trendlens}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-trendlens_dev_secret_change_in_production_super_secure_key_123456789}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_MINUTES=${ACCESS_TOKEN_MINUTES:-60}
      - PROVIDER_API_KEY=${PROVIDER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trendlens_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
